{% load static %}<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Monthly Report Generator{% endblock %}</title>
<link rel="icon" href="{% static 'portal/favicon.ico' %}" sizes="any">
<link rel="apple-touch-icon" href="{% static 'portal/idxsti-mark.png' %}">
<link rel="stylesheet" href="{% static 'portal/shell.css' %}">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 var(--font); background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  main { padding:24px 0 48px; }
  h1 { font-size:20px; margin:0 0 16px; } h2 { font-size:16px; margin:24px 0 8px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:var(--surface); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .btn { display:inline-block; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:7px 14px;
         border-radius:6px; text-decoration:none; cursor:pointer; font:inherit; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn:hover { border-color:var(--muted); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  input[type=checkbox] { accent-color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .s-generated { color:var(--warn); } .s-approved { color:var(--text); } .s-sent { color:var(--ok); }
  .s-failed { color:var(--bad); } .s-queued, .s-generating { color:var(--muted); }
  .st-Kritis { color:var(--bad); font-weight:600; } .st-Perlu { color:var(--warn); font-weight:600; }
  .msg { padding:10px 14px; border-radius:6px; margin-bottom:12px; background:var(--surface); border:1px solid var(--line); }
  .msg.error { border-color:var(--bad); color:var(--bad); background:var(--accent-soft); } .msg.success { border-color:var(--ok); color:var(--ok); }
  .msg.warning { border-color:var(--warn); color:var(--warn); }
  .muted { color:var(--muted); } pre { white-space:pre-wrap; font-size:12px; max-height:320px; overflow:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
  .stat .v { font-size:22px; font-weight:600; } .stat .l { color:var(--muted); font-size:12px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .scroll { overflow-x:auto; }
  textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
  .field { margin-bottom:14px; } .field > label { display:block; font-weight:600; margin-bottom:4px; }
  .field .help { color:var(--muted); font-size:12px; margin-top:2px; }
  .field .err { color:var(--bad); font-size:12px; }
  .two { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:0 16px; }
  .checks { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px 16px; }
  .checks label { font-weight:400; display:flex; gap:6px; align-items:center; }
  .btn.danger { color:var(--bad); }
  a { color:var(--accent); }
  .big { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .progress { display:flex; flex-direction:column; gap:6px; }
  .progress .top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .bar { height:8px; background:#ecebe8; border-radius:99px; overflow:hidden; }
  .bar .fill { height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .8s ease; }
  .progress.small { min-width:180px; font-size:12px; gap:3px; }
  .progress.small .bar { height:6px; }
  iframe { width:100%; height:80vh; border:1px solid var(--line); border-radius:8px; }
</style>
{% block head %}{% endblock %}
</head>
<body data-status-url="{% url 'reports:status_many' %}">
{% include "portal/_header.html" %}
<main><div class="wrap">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div></main>
<script src="{% static 'portal/progress.js' %}" defer></script>
</body>
</html>
